app = "looklookduck-cms"
primary_region = "sin"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "1337"
  DATABASE_CLIENT = "postgres"
  NODE_ENV = "production"

[http_service]
  internal_port = 1337
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/_health"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
